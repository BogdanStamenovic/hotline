schema: 1
name: hotline
description: Voice/text bridge to Claude Code sessions
homepage: https://github.com/BogdanStamenovic/hotline
tags: [cli, claude, voice, discord, python]
install:
  platforms: [linux]
  setup:
    linux:
      - python -m venv .venv
      - .venv/bin/python -m pip install -e .
  update:
    linux: [.venv/bin/python -m pip install -e .]
  remove: []
command:
  linux: .venv/bin/hotline
