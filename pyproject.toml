[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotline"
version = "0.1.0"
description = "Voice/text bridge to Claude Code sessions"
readme = "README.md"
# 3.12 rather than the house 3.10 floor: the Discord and voice extras below force
# it. discord.py[voice] pins PyNaCl<1.6 which has no 3.14 wheel, and CTranslate2
# wants CUDA 12 while Arch ships 13.3. The core router itself is 3.10-clean.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["claude", "voice", "discord", "ipc", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
discord = ["py-cord[voice]>=2.6", "aiohttp>=3.9"]
voice = ["faster-whisper>=1.0", "silero-vad>=5.1", "soxr>=0.5", "numpy>=1.26", "piper-tts>=1.2"]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<7",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
]

[project.scripts]
hotline = "hotline.cli:main"
hotlined = "hotline.daemon:main"
hotline-page = "hotline.page_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hotline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
